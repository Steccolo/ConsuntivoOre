name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/ConsuntivoOre.Tests -c Release
      - run: choco install innosetup -y --no-progress
      - run: ./build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.exe).FullName --generate-notes
